g:8px 11px}.small-note{text-align:center;font-size:11px;line-height:1.65;color:#8A968F;margin-top:21px}.title{font-weight:900;font-size:32px;line-height:1.26;letter-spacing:-.065em;margin:13px 0 10px}.desc{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 29px}.section{font-size:12px;font-weight:900;letter-spacing:.11em;margin:27px 0 13px}.name{height:54px;background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;display:flex;align-items:center;padding:0 14px;gap:10px}.name span{font-size:12px;color:#9EADA6;font-weight:800;width:23px}.name input{border:0;min-width:0;outline:0;flex:1;color:var(--ink);font-size:15px;font-weight:750}.name button{border:0;color:var(--muted);font-size:21px;background:transparent;padding:4px}.add{background:transparent;border:1px dashed #9EB5AB;width:100%;border-radius:12px;height:43px;color:var(--dark);font-weight:800}.categories{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{height:129px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink)}.cat.active{background:var(--dark);color:#fff;border-color:var(--dark)}.cat .glyph{display:block;color:var(--coral);font-size:24px;margin-bottom:11px}.cat.active .glyph{color:#ffdccd}.cat strong{display:block;font-size:16px}.cat small{display:block;font-size:10px;color:var(--muted);margin-top:6px}.cat.active small{color:#D5E0D9}.rounds{display:flex;gap:8px}.rounds button{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;height:78px;color:var(--ink)}.rounds button.active{color:#fff;background:var(--dark);border-color:var(--dark)}.rounds strong{display:block;font-size:25px;font-weight:900}.rounds small{font-size:11px}.rule{display:flex;gap:20px;border-bottom:1px solid var(--line);padding:17px 0}.rule .num{font-size:12px;color:var(--coral);font-weight:900}.rule strong{font-size:16px}.rule p{font-size:13px;color:var(--muted);line-height:1.6;margin:7px 0 0}.handoff{margin:22px 0 0;min-height:390px;background:var(--soft);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.halo{width:110px;height:110px;border-radius:50%;border:1px solid #B8D0C3;display:grid;place-items:center;font-size:60px;font-weight:300;color:var(--coral);margin-bottom:28px}.handoff label{color:var(--muted);font-size:13px;font-weight:700}.handoff h2{color:var(--dark);font-size:42px;letter-spacing:-.07em;margin:9px 0 12px}.handoff p{color:var(--muted);font-size:13px;line-height:1.7;margin:0}.dots{display:flex;gap:6px;margin-top:29px}.dots i{display:block;width:20px;height:5px;border-radius:5px;background:#C2D6CC}.dots i.fill{background:var(--coral)}.question{font-size:32px;line-height:1.35;letter-spacing:-.055em;margin:18px 0;font-weight:900}.vlabel{font-weight:900;color:var(--dark);font-size:13px;margin:29px 0 12px}.choice{height:auto;min-height:84px;width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;margin-bottom:11px;padding:18px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--ink)}.choice.active{background:var(--dark);color:#fff}.choice .letter{color:var(--coral);font-weight:900;font-size:24px}.choice.active .letter{color:#fff}.choice strong{font-size:17px;flex:1}.choice .check{color:#bbb}.choice.active .check{color:#fff}.predictions{display:flex;gap:10px;margin-top:13px}.prediction{flex:1;border:1px solid var(--line);background:#fff;border-radius:13px;padding:17px 12px;display:flex;justify-content:space-between;font-size:14px;font-weight:800}.prediction.active{background:var(--dark);color:#fff}.resulthead{font-size:39px;font-weight:900;letter-spacing:-.07em;margin:12px 0}.resulthead em{color:var(--coral);font-style:normal}.resultquestion{font-size:14px;color:var(--muted);margin:9px 0 21px}.resultbox{background:#fff;border-radius:18px;padding:21px}.barhead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:11px}.barhead small{display:block;color:var(--coral);font-weight:900}.barhead strong{font-size:14px}.barhead .pct{font-size:28px;font-weight:900}.bar{height:11px;background:var(--chip);border-radius:7px;overflow:hidden}.bar .fill{height:100%;background:var(--dark);border-radius:7px}.bar .fill.b{background:var(--coral)}.resultfoot{font-size:12px;color:var(--muted);font-weight:750;margin:21px 0 0}.score{border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:13px 0}.avatar{width:39px;height:39px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-weight:900;color:var(--dark)}.score .meta{flex:1}.score .meta strong{display:block;font-size:15px}.score .meta small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.score b{color:var(--dark);font-size:18px}.winner{background:var(--dark);color:#fff;border-radius:22px;padding:25px;min-height:215px;display:flex;flex-direction:column;justify-content:center}.winner small{color:#C2D8CB;letter-spacing:.15em;font-size:11px;font-weight:800}.winner h2{font-size:40px;letter-spacing:-.06em;margin:17px 0 7px}.winner p{color:#F8AA8F;letter-spacing:.1em;font-size:13px;font-weight:900;margin:0}.stats{display:flex;justify-content:space-around;text-align:center;background:var(--chip);padding:20px 8px;border-radius:16px;margin-top:21px}.stats strong{font-size:27px;display:block}.stats small{color:var(--muted);font-size:11px}.ranknum{color:var(--coral);width:34px;font-weight:900}.error{color:#AA3E27;margin-top:12px;font-size:13px}

const QUESTIONS = [{"id":"f01","category":"친구","question":"친구들과 여행을 간다면 더 끌리는 쪽은?","a":"즉흥으로 떠나기","b":"일정표부터 만들기"},{"id":"f02","category":"친구","question":"약속 시간이 한 시간 비었다. 뭘 할까?","a":"근처 구경하기","b":"카페에서 기다리기"},{"id":"f03","category":"친구","question":"단체 채팅방에서 내 역할은?","a":"대화 주도하기","b":"읽고 반응하기"},{"id":"f04","category":"친구","question":"친구 생일 선물, 더 마음이 가는 건?","a":"취향 맞춤 선물","b":"갖고 싶던 실용템"},{"id":"f05","category":"친구","question":"친구가 고민을 털어놓을 때 나는?","a":"해결책 제안","b":"먼저 공감하기"},{"id":"f06","category":"친구","question":"주말 모임 장소를 고른다면?","a":"익숙한 단골집","b":"새로 생긴 핫플"},{"id":"f07","category":"친구","question":"친구와 즉석 여행, 가장 중요한 것은?","a":"함께 가는 사람","b":"여행지 자체"},{"id":"f08","category":"친구","question":"단체 사진을 찍을 때 나는?","a":"사진 찍는 사람","b":"포즈 잡는 사람"},{"id":"f09","category":"친구","question":"친구끼리 하는 게임에서 나는?","a":"승부에 진심","b":"재미가 먼저"},{"id":"f10","category":"친구","question":"갑작스러운 번개 모임 연락이 왔다.","a":"일단 나간다","b":"오늘은 집이 최고"},{"id":"f11","category":"친구","question":"친구에게 연락할 때 더 편한 방식은?","a":"바로 전화","b":"메시지 먼저"},{"id":"f12","category":"친구","question":"우리 모임의 결정 방식은?","a":"한 사람이 정하기","b":"모두 투표하기"},{"id":"f13","category":"친구","question":"오랜만에 만난 친구와 하고 싶은 건?","a":"길게 수다 떨기","b":"새로운 활동하기"},{"id":"f14","category":"친구","question":"친구가 길을 잃었다면?","a":"위치 알려주기","b":"직접 데리러 가기"},{"id":"f15","category":"친구","question":"모임에서 더 신나는 순간은?","a":"예상 못 한 이벤트","b":"완벽하게 맞는 계획"},{"id":"d01","category":"연애","question":"첫 데이트 장소로 더 끌리는 건?","a":"조용한 카페","b":"활기찬 전시·축제"},{"id":"d02","category":"연애","question":"호감 있는 사람의 연락 스타일은?","a":"짧아도 자주","b":"길게 가끔"},{"id":"d03","category":"연애","question":"이상적인 주말 데이트는?","a":"집에서 영화 보기","b":"밖에서 새로운 경험"},{"id":"d04","category":"연애","question":"중요한 기념일에 더 좋은 건?","a":"서프라이즈 이벤트","b":"함께 정한 계획"},{"id":"d05","category":"연애","question":"상대의 가장 매력적인 모습은?","a":"다정하게 배려할 때","b":"자기 일에 몰입할 때"},{"id":"d06","category":"연애","question":"취향이 다른 연인과의 식사 선택은?","a":"번갈아 가며 고르기","b":"새로운 메뉴 함께 도전"},{"id":"d07","category":"연애","question":"데이트 중 비가 쏟아진다면?","a":"실내 코스로 변경","b":"비 맞으며 산책"},{"id":"d08","category":"연애","question":"고백한다면 선호하는 방식은?","a":"직접 만나서","b":"마음을 담은 편지"},{"id":"d09","category":"연애","question":"연인의 취미에 대한 내 태도는?","a":"함께 배워 보기","b":"각자 취향 존중"},{"id":"d10","category":"연애","question":"기념사진을 남긴다면?","a":"자연스러운 순간","b":"계획한 콘셉트 사진"},{"id":"d11","category":"연애","question":"더 설레는 약속은?","a":"갑작스런 드라이브","b":"미리 예약한 레스토랑"},{"id":"d12","category":"연애","question":"이해받는다고 느끼는 순간은?","a":"말없이 챙겨줄 때","b":"말로 표현해줄 때"},{"id":"d13","category":"연애","question":"연인과 여행할 때 중요하게 보는 건?","a":"함께 보내는 시간","b":"색다른 경험"},{"id":"d14","category":"연애","question":"더 기분 좋은 칭찬은?","a":"센스가 좋다는 말","b":"마음이 따뜻하다는 말"},{"id":"d15","category":"연애","question":"데이트 코스를 맡는다면?","a":"미리 전부 예약","b":"함께 걸으며 결정"},{"id":"e01","category":"음식","question":"점심 메뉴를 고른다면?","a":"뜨끈한 국물","b":"든든한 덮밥"},{"id":"e02","category":"음식","question":"탕수육 소스는?","a":"찍어 먹기","b":"부어 먹기"},{"id":"e03","category":"음식","question":"야식으로 더 당기는 건?","a":"바삭한 치킨","b":"따끈한 피자"},{"id":"e04","category":"음식","question":"카페에서 한 가지만 시킨다면?","a":"커피","b":"디저트"},{"id":"e05","category":"음식","question":"새로운 음식 앞에서 나는?","a":"모험적으로 도전","b":"검증된 맛 선택"},{"id":"e06","category":"음식","question":"라면에 더 잘 어울리는 건?","a":"계란 추가","b":"치즈 추가"},{"id":"e07","category":"음식","question":"친구들과 배달 주문은?","a":"다양하게 여러 개","b":"큰 메뉴 하나 집중"},{"id":"e08","category":"음식","question":"평생 한 가지만 마신다면?","a":"아이스 아메리카노","b":"달콤한 라떼"},{"id":"e09","category":"음식","question":"식사에서 더 중요한 건?","a":"맛","b":"분위기"},{"id":"e10","category":"음식","question":"빵집에서 먼저 집는 건?","a":"소금빵","b":"크루아상"},{"id":"e11","category":"음식","question":"매운 음식을 먹을 때 나는?","a":"도전할수록 즐거움","b":"적당한 맵기가 최고"},{"id":"e12","category":"음식","question":"여행지 맛집을 찾는다면?","a":"현지인 추천","b":"평점·후기 검색"},{"id":"e13","category":"음식","question":"냉면은?","a":"물냉면","b":"비빔냉면"},{"id":"e14","category":"음식","question":"디저트 최강 조합은?","a":"케이크와 커피","b":"아이스크림과 과일"},{"id":"e15","category":"음식","question":"퇴근 후 저녁 선택은?","a":"간편한 한 끼","b":"제대로 한 상"},{"id":"l01","category":"일상","question":"하루를 시작하는 스타일은?","a":"일찍 일어나 여유롭게","b":"마지막까지 푹 자기"},{"id":"l02","category":"일상","question":"하루의 자유시간이 생긴다면?","a":"새로운 취미 도전","b":"아무것도 안 하고 쉬기"},{"id":"l03","category":"일상","question":"여행 계획은 언제 세울까?","a":"몇 주 전부터","b":"떠나기 직전에"},{"id":"l04","category":"일상","question":"사진첩 속 사진이 더 많은 쪽은?","a":"사람과 추억","b":"음식과 풍경"},{"id":"l05","category":"일상","question":"새로운 물건을 살 때 나는?","a":"꼼꼼히 비교","b":"마음에 들면 바로"},{"id":"l06","category":"일상","question":"좋아하는 계절은?","a":"따뜻한 봄·여름","b":"선선한 가을·겨울"},{"id":"l07","category":"일상","question":"정리 정돈은 어떤 스타일?","a":"그때그때 바로","b":"한 번에 몰아서"},{"id":"l08","category":"일상","question":"운동할 때 더 필요한 건?","a":"신나는 음악","b":"조용한 집중"},{"id":"l09","category":"일상","question":"새로운 기술을 배울 때는?","a":"바로 만져보기","b":"설명부터 읽기"},{"id":"l10","category":"일상","question":"길을 걷다가 예쁜 가게를 봤다.","a":"들어가 본다","b":"나중에 저장한다"},{"id":"l11","category":"일상","question":"미루고 있던 일을 시작하는 방법은?","a":"작게라도 바로","b":"완벽히 준비한 후"},{"id":"l12","category":"일상","question":"하루 중 더 좋은 시간은?","a":"고요한 아침","b":"감성적인 밤"},{"id":"l13","category":"일상","question":"약속 없는 휴일에 하고 싶은 건?","a":"혼자 외출하기","b":"집에서 충전하기"},{"id":"l14","category":"일상","question":"휴대폰 배터리 15%, 나는?","a":"바로 충전 찾기","b":"아직 괜찮다"},{"id":"l15","category":"일상","question":"새로운 도시에서 더 기대되는 건?","a":"낯선 거리 걷기","b":"유명 명소 찾아가기"}];

const title=(a,b,desc='')=>`${kicker(a)}<h1 class="title">${b}</h1><p class="desc">${desc}</p>`;
function setScreen(s){state.screen=s; render(); window.scrollTo(0,0)}
function goHome(){state.screen='home';state.ballots=[];state.results=[];state.deck=[];render();window.scrollTo(0,0)}
function showRules(){setScreen(state.screen==='rules'?'home':'rules')}
function addName(){if(state.names.length<8){state.names.push('플레이어 '+(state.names.length+1));render()}}
function removeName(i){if(state.names.length>2){state.names.splice(i,1);render()}}
function editName(i,v){state.names[i]=v}
function chooseCategory(x){state.category=x;render()}
function chooseRound(x){state.rounds=x;render()}
function start(){let names=state.names.map(n=>n.trim());if(new Set(names.map(n=>n.toLowerCase())).size!==names.length||names.some(n=>!n||n.length>10)){alert('이름은 최대 10글자, 서로 다르게 입력해 주세요.');return}state.names=names;state.deck=QUESTIONS.filter(q=>state.category==='전체'||q.category===state.category).sort(()=>Math.random()-.5).slice(0,state.rounds);state.round=0;state.player=0;state.ballots=[];state.results=[];state.choice=null;state.pred=null;setScreen('handoff')}
function castVote(){if(!state.choice||!state.pred)return;state.ballots.push({choice:state.choice,pred:state.pred});state.choice=null;state.pred=null;if(state.ballots.length<state.names.length){state.player++;setScreen('handoff');return}let a=state.ballots.filter(x=>x.choice==='a').length,b=state.names.length-a,majority=a===b?'tie':a>b?'a':'b';let points=state.ballots.map(v=>majority==='tie'?5:(v.pred===majority?10:0)+(v.choice!==majority?5:0));state.results.push({a,b,majority,points,votes:[...state.ballots]});state.ballots=[];state.player=0;setScreen('reveal')}
function voteChoice(x){state.choice=x;render()}
function votePred(x){state.pred=x;render()}
function nextRound(){if(state.round+1>=state.deck.length){setScreen('final')}else{state.round++;state.player=0;setScreen('handoff')}}
function tally(){return state.names.map((name,i)=>({name,i,points:state.results.reduce((acc,r)=>acc+r.points[i],0)})).sort((a,b)=>b.points-a.points||a.i-b.i)}
async function share(){let lines=tally().map((p,i)=>`${i+1}위 ${p.name} · ${p.points}점`).join('\n');let message=`GALAPICK 🎉\n${state.names.length}명 · ${state.deck.length}라운드\n\n${lines}`;if(navigator.share){try{await navigator.share({text:message})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(message);alert('결과가 복사됐어요.')}else alert(message)}
function render(){let s=state.screen,q=state.deck[state.round],r=state.results[state.results.length-1];$('help').textContent=['handoff','vote','reveal','final'].includes(s)?`ROUND ${Math.min(state.round+1,state.deck.length)} / ${state.deck.length}`:(s==='rules'?'닫기':'게임 방법 ↗');let h='';
if(s==='home')h=`<section class="hero">${kicker('● &nbsp; THE PARTY STARTS HERE')}<h1>같은 편인 줄<br>알았지<b>?</b></h1><p>선택하고, 다수를 예측하고,<br>서로의 뜻밖의 취향을 발견해 봐.</p></section><div class="visual"><small>A OR B? &nbsp; / &nbsp; PICK A SIDE</small><div class="duel"><div class="orb a">A</div><span class="vs">VS</span><div class="orb b">B</div></div><small>2–8 PLAYERS &nbsp; · &nbsp; NO LOGIN &nbsp; · &nbsp; OFFLINE</small></div>${btn('새 게임 시작하기',"setScreen('setup')")}<div class="pills">${tag('한 대로 플레이')}${tag('60개의 질문')}${tag('비밀 투표')}</div><p class="small-note">AI 없이도 바로 시작할 수 있는 첫 번째 플레이 버전.</p>`;
if(s==='rules')h=title('HOW TO PLAY / 01','방법은 간단해.','단 하나의 휴대폰만 있으면 충분해요.')+[['이름을 등록해요','2~8명까지 함께 플레이할 수 있어요.'],['돌아가며 선택해요','A/B 선택 후 다른 사람들이 더 많이 고를 쪽을 예측해요.'],['결과를 공개해요','다수 예측 성공 +10점, 소수 선택 보너스 +5점. 동률 모두 +5점.'],['최종 순위 확인','가장 많은 점수를 얻은 사람이 우승해요.']].map(([a,b],i)=>`<div class="rule"><span class="num">0${i+1}</span><div><strong>${a}</strong><p>${b}</p></div></div>`).join('')+btn('플레이 시작',"setScreen('setup')");
if(s==='setup')h=title('GAME SETUP / 01','우리끼리 시작해 볼까?','인원과 주제를 정하면 바로 시작돼요.')+`<div class="section">PLAYERS &nbsp; <span style="color:var(--muted)">${state.names.length} / 8</span></div>`+state.names.map((n,i)=>`<div class="name"><span>${String(i+1).padStart(2,'0')}</span><input maxlength="10" aria-label="${i+1}번째 이름" value="${esc(n)}" onchange="editName(${i},this.value)" oninput="editName(${i},this.value)">${state.names.length>2?`<button aria-label="삭제" onclick="removeName(${i})">×</button>`:''}</div>`).join('')+(state.names.length<8?'<button class="add" onclick="addName()">＋ 인원 추가</button>':'')+`<div class="section">TOPIC</div><div class="categories">`+CATS.map(([n,desc,g])=>`<button class="cat ${state.category===n?'active':''}" onclick="chooseCategory('${n}')"><span class="glyph">${g}</span><strong>${n}</strong><small>${desc}</small></button>`).join('')+`</div><div class="section">ROUNDS</div><div class="rounds">`+[5,10,15].map(n=>`<button class="${n===state.rounds?'active':''}" onclick="chooseRound(${n})"><strong>${n}</strong><small>라운드</small></button>`).join('')+`</div>`+btn('게임 시작','start()')+`<p class="small-note">투표 내용은 기기에 저장하거나 서버로 보내지 않아요.</p>`;
if(s==='handoff')h=kicker(`SECRET TURN / ${state.player+1} OF ${state.names.length}`)+`<div class="handoff"><div class="halo">↗</div><label>다음 플레이어에게 전달</label><h2>${esc(state.names[state.player])}</h2><p>앞사람의 선택은 비밀!<br>화면을 확인하고 혼자 선택해 주세요.</p><div class="dots">${state.names.map((_,i)=>`<i class="${i<=state.player?'fill':''}"></i>`).join('')}</div></div>`+btn('내 차례 시작하기',"setScreen('vote')");
if(s==='vote')h=kicker('MAKE YOUR PICK / '+esc(state.names[state.player]))+`<h1 class="question">${esc(q.question)}</h1>${tag(q.category)}<div class="vlabel">01 &nbsp; 나의 선택</div>`+['a','b'].map(x=>`<button class="choice ${state.choice===x?'active':''}" onclick="voteChoice('${x}')"><span class="letter">${x.toUpperCase()}</span><strong>${esc(q[x])}</strong><span class="check">${state.choice===x?'●':'○'}</span></button>`).join('')+`<div class="vlabel">02 &nbsp; 다수의 선택 예측</div><p style="font-size:13px;color:var(--muted);margin:0">다른 사람들은 어느 쪽을 더 많이 고를까?</p><div class="predictions">`+['a','b'].map(x=>`<button class="prediction ${state.pred===x?'active':''}" onclick="votePred('${x}')">${x.toUpperCase()}가 다수 <span>${state.pred===x?'●':'○'}</span></button>`).join('')+`</div>`+btn(state.player===state.names.length-1?'결과 공개하기':'선택 확정하고 넘기기','castVote()',false,!state.choice||!state.pred)+`<p class="small-note">이 화면을 넘기면 선택은 변경할 수 없어요.</p>`;
if(s==='reveal')h=kicker('ROUND RESULT / '+(state.round+1))+`<h1 class="resulthead">우리의 선택은<em>?</em></h1><p class="resultquestion">${esc(q.question)}</p><div class="resultbox">`+['a','b'].map(x=>`<div class="barhead"><div><small>${x.toUpperCase()}</small><strong>${esc(q[x])}</strong></div><div class="pct">${Math.round(r[x]/state.names.length*100)}%</div></div><div class="bar" style="margin-bottom:24px"><div class="fill ${x}" style="width:${r[x]/state.names.length*100}%"></div></div>`).join('')+`<p class="resultfoot">${r.majority==='tie'?'완벽한 동률!':r.majority.toUpperCase()+'가 이번 라운드의 다수'}</p></div><div class="section">THIS ROUND</div>`+state.names.map((n,i)=>`<div class="score"><div class="avatar">${esc(n[0])}</div><div class="meta"><strong>${esc(n)}</strong><small>선택 ${r.votes[i].choice.toUpperCase()} · 예측 ${r.votes[i].pred.toUpperCase()}</small></div><b>+${r.points[i]}</b></div>`).join('')+btn(state.round+1>=state.deck.length?'최종 순위 확인':'다음 라운드','nextRound()');
if(s==='final'){let board=tally();h=kicker('GAME OVER / FINAL SCORE')+`<h1 class="title" style="font-size:43px;margin:20px 0">오늘의 최강<br><span style="color:var(--coral)">눈치왕.</span></h1><div class="winner"><small>★ &nbsp; WINNER</small><h2>${esc(board[0].name)}</h2><p>${board[0].points} POINTS</p>${board[1]?.points===board[0].points?'<small style="margin-top:10px">공동 1위가 있어요!</small>':''}</div><div class="section">FINAL RANKING</div>`+board.map((p,i)=>`<div class="score"><span class="ranknum">${String(i+1).padStart(2,'0')}</span><div class="meta"><strong>${esc(p.name)}</strong></div><b>${p.points}점</b></div>`).join('')+`<div class="stats"><div><strong>${state.deck.length}</strong><small>총 라운드</small></div><div><strong>${state.results.filter(x=>x.a===0||x.b===0).length}</strong><small>만장일치</small></div><div><strong>${state.results.filter(x=>x.majority==='tie').length}</strong><small>동률</small></div></div>`+btn('결과 공유하기','share()')+btn('같은 멤버로 다시하기','start()',true)+`<p style="text-align:center;margin-top:25px"><button class="headlink" onclick="goHome()">홈으로 돌아가기</button></p>`}
$('main').innerHTML=h;}
render();
</script></body></html>
