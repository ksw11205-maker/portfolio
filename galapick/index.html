
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GALAPICK — 병맛 밸런스 게임</title>
<style>
:root{
  --bg:#fff6d8; --paper:#fffdf5; --ink:#17221b; --muted:#637061; --line:#1a1a1a;
  --red:#ff6b57; --mint:#63d6b2; --sky:#8fd3ff; --yell:#ffd84d; --pink:#ff8bc2; --lav:#b8a4ff;
  --green:#c9f266; --orange:#ffb347; --shadow:0 6px 0 #111; --radius:28px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 10% 10%, #fff2a5 0 10%, transparent 10%),
 radial-gradient(circle at 90% 20%, #ffe0f0 0 8%, transparent 8%),
 radial-gradient(circle at 12% 85%, #c4f7ff 0 10%, transparent 10%),
 linear-gradient(180deg,#fff8df 0%,#fff4cb 100%);
 color:var(--ink);font-family: ui-rounded, system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
 letter-spacing:-.03em}
 button,input{font:inherit}
 button{cursor:pointer;-webkit-tap-highlight-color:transparent}
 button:active{transform:translateY(2px)}
 .frame{width:min(100%,480px);margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 18px;padding-top:max(env(safe-area-inset-top),14px);padding-bottom:max(env(safe-area-inset-bottom),18px)}
 header{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 16px;position:sticky;top:0;background:linear-gradient(180deg,rgba(255,248,223,.96),rgba(255,248,223,.78),rgba(255,248,223,0));backdrop-filter:blur(8px);z-index:20}
 .logo{display:flex;align-items:center;gap:10px;font-weight:1000;letter-spacing:-.05em;font-size:19px;cursor:pointer}
 .logo-badge{width:42px;height:42px;border:3px solid var(--line);border-radius:14px;background:var(--red);box-shadow:var(--shadow);display:grid;place-items:center;transform:rotate(-8deg)}
 .logo-badge span{font-size:22px}
 .logo em{font-style:normal;color:var(--red)}
 .headlink{background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 #111;border-radius:999px;padding:10px 14px;font-weight:900;font-size:12px;color:var(--ink)}
 .headlink:active{box-shadow:0 1px 0 #111;transform:translateY(3px)}
 .main{flex:1;padding-bottom:30px}
 .kicker{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:3px solid var(--line);background:var(--paper);box-shadow:0 4px 0 #111;border-radius:999px;font-size:11px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase}
 .kdot{width:10px;height:10px;border-radius:999px;background:var(--red);border:2px solid var(--line)}
 .hero-title,.title,.question,.result-title{font-weight:1000;line-height:1.05;letter-spacing:-.06em;margin:16px 0 12px}
 .hero-title{font-size:clamp(46px,12vw,66px)} .title{font-size:clamp(34px,10vw,44px)} .question{font-size:clamp(32px,9vw,42px)} .result-title{font-size:clamp(38px,10vw,48px)}
 .hero-title b,.title b,.result-title em{color:var(--red);font-style:normal}
 .sub,.desc,.small-note{color:var(--muted);line-height:1.6}
 .sub{font-size:16px;margin:0 0 18px}
 .desc{font-size:14px;margin:0 0 18px}
 .small-note{font-size:12px;text-align:center;margin-top:16px}
 .panel,.choice,.prediction,.cat,.round-btn,.name-row,.resultbox,.winner,.score,.setup-card{border:3px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);background:var(--paper)}
 .hero-grid{display:grid;grid-template-columns:1fr;gap:16px}
 .monster-card{padding:18px;background:linear-gradient(180deg,#fff,#fff7e2);position:relative;overflow:hidden}
 .sticker{position:absolute;border:3px solid var(--line);box-shadow:0 4px 0 #111;padding:8px 12px;border-radius:999px;font-weight:1000;font-size:12px;background:#fff;transform:rotate(-8deg)}
 .s1{top:14px;right:16px;background:var(--sky)} .s2{bottom:16px;left:14px;background:var(--green);transform:rotate(7deg)}
 .vs-stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 8px 8px}
 .monster{display:flex;flex-direction:column;align-items:center;gap:8px}
 .blob{width:112px;height:112px;border:4px solid var(--line);box-shadow:0 5px 0 #111;border-radius:38% 62% 52% 48% / 42% 45% 55% 58%;display:grid;place-items:center;font-size:52px;background:var(--mint)}
 .blob.b{background:var(--pink);transform:rotate(8deg)} .blob.a{transform:rotate(-8deg)}
 .monster label{font-weight:1000;font-size:14px}
 .vs-chip{display:grid;place-items:center;width:70px;height:70px;border-radius:999px;background:var(--yell);border:4px solid var(--line);box-shadow:0 5px 0 #111;font-size:24px;font-weight:1000;transform:rotate(-10deg)}
 .feature-row{display:flex;flex-wrap:wrap;gap:10px}
 .pill{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:3px solid var(--line);box-shadow:0 4px 0 #111;border-radius:999px;background:#fff;font-size:12px;font-weight:900}
 .cta{width:100%;margin-top:6px;height:62px;border:none;background:var(--red);color:#fff;border:3px solid var(--line);box-shadow:0 6px 0 #111;border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:17px;font-weight:1000;text-align:left}
 .cta.secondary{background:var(--sky);color:var(--ink)} .cta.ghost{background:#fff;color:var(--ink)} .cta:disabled{opacity:.45;cursor:not-allowed}
 .arrow{font-size:26px}
 .setup-card{padding:18px;margin-top:16px}
 .section{font-size:12px;font-weight:1000;letter-spacing:.11em;margin:0 0 12px;display:flex;align-items:center;gap:8px}
 .section::before{content:"";width:8px;height:8px;border:2px solid var(--line);border-radius:999px;background:var(--red)}
 .name-row{display:flex;align-items:center;gap:10px;padding:0 12px;height:58px;margin-bottom:10px}
 .name-row span{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:999px;background:var(--yell);border:2px solid var(--line);font-size:12px;font-weight:1000}
 .name-row input{border:none;outline:none;background:transparent;flex:1;font-size:15px;font-weight:800;color:var(--ink)}
 .iconbtn{border:none;background:transparent;font-size:24px}
 .dash-btn{width:100%;height:46px;border:3px dashed var(--line);border-radius:18px;background:#fff;font-weight:1000}
 .categories{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .cat{padding:14px;min-height:124px;text-align:left}
 .cat.active{background:var(--ink);color:#fff}
 .cat .glyph{font-size:26px;display:block;margin-bottom:8px}
 .cat strong{display:block;font-size:16px} .cat small{display:block;margin-top:6px;font-size:11px;color:inherit;opacity:.75;line-height:1.45}
 .rounds{display:flex;gap:10px}.round-btn{flex:1;height:82px;background:#fff}.round-btn.active{background:var(--red);color:#fff}
 .round-btn strong{display:block;font-size:28px;font-weight:1000}.round-btn small{font-size:11px;font-weight:800}
 .rule{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:2px dashed #b3baaa}.rule:last-of-type{border-bottom:none}.rule-badge{width:34px;height:34px;display:grid;place-items:center;background:var(--yell);border:3px solid var(--line);border-radius:12px;box-shadow:0 4px 0 #111;font-weight:1000;font-size:12px}.rule strong{display:block;font-size:16px;margin-bottom:6px}.rule p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
 .handoff-card{padding:24px;text-align:center;background:linear-gradient(180deg,#fff,#f3ffe8)} .handoff-badge{width:118px;height:118px;border-radius:40px;border:4px solid var(--line);box-shadow:0 5px 0 #111;background:var(--orange);display:grid;place-items:center;font-size:56px;margin:0 auto 18px;transform:rotate(-8deg)}
 .turn-name{font-size:44px;font-weight:1000;line-height:1.05;margin:10px 0 12px}.dots{display:flex;justify-content:center;gap:6px;margin-top:20px}.dots i{display:block;width:22px;height:8px;border-radius:99px;border:2px solid var(--line);background:#fff}.dots i.fill{background:var(--red)}
 .tags{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 6px}
 .artbox{position:relative;padding:16px;margin:14px 0 16px;background:linear-gradient(180deg,#fff 0,#fff7e7 100%)}
 .burst{position:absolute;right:12px;top:12px;background:var(--yell);border:3px solid var(--line);box-shadow:0 4px 0 #111;padding:8px 10px;clip-path:polygon(50% 0%,61% 19%,82% 7%,77% 28%,100% 27%,82% 45%,97% 61%,74% 62%,78% 86%,57% 75%,49% 100%,38% 78%,16% 92%,20% 68%,0 70%,16% 49%,4% 30%,25% 29%,19% 9%,39% 18%);font-size:10px;font-weight:1000;line-height:1.2;text-align:center}
 .doodle{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;min-height:188px}
 .char{display:flex;flex-direction:column;align-items:center;gap:6px}
 .char .svgwrap{width:100%;max-width:150px;aspect-ratio:1/1;filter:drop-shadow(0 4px 0 #111)}
 .char label{font-size:13px;font-weight:1000;text-align:center;line-height:1.3}
 .mid-vs{font-size:22px;font-weight:1000;transform:rotate(-10deg);background:#fff;border:3px solid var(--line);border-radius:999px;box-shadow:0 4px 0 #111;padding:8px 10px;margin-bottom:28px}
 .vlabel{font-size:12px;font-weight:1000;letter-spacing:.08em;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
 .vlabel::before{content:"";width:7px;height:7px;border:2px solid var(--line);border-radius:999px;background:var(--red)}
 .choice{width:100%;padding:14px 14px 14px 12px;display:flex;align-items:center;gap:12px;margin-bottom:10px;text-align:left;background:#fff}
 .choice.active{background:var(--ink);color:#fff}
 .badge{width:34px;height:34px;border-radius:999px;border:3px solid var(--line);display:grid;place-items:center;background:var(--yell);font-weight:1000;box-shadow:0 4px 0 #111;flex:none}
 .choice.active .badge{background:var(--red);color:#fff}
 .choice strong{flex:1;font-size:16px;line-height:1.35}.choice small{font-size:24px}
 .predictions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prediction{padding:16px 12px;text-align:left;background:#fff}.prediction.active{background:var(--sky)} .prediction strong{display:block;font-size:17px} .prediction span{display:block;font-size:12px;color:var(--muted);margin-top:6px}
 .resultbox{padding:18px;margin-top:12px}.barhead{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:8px}.barhead small{display:block;font-size:11px;color:var(--muted);font-weight:1000}.barhead strong{font-size:14px}.pct{font-size:28px;font-weight:1000}
 .bar{height:16px;border-radius:999px;border:3px solid var(--line);background:#fff;overflow:hidden;margin-bottom:18px}.fill{height:100%;background:var(--mint)} .fill.b{background:var(--red)}
 .score{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:10px}
 .avatar{width:42px;height:42px;border-radius:16px;border:3px solid var(--line);background:var(--sky);display:grid;place-items:center;box-shadow:0 4px 0 #111;font-weight:1000}.meta{flex:1}.meta strong{display:block;font-size:15px}.meta small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.points{font-weight:1000;font-size:18px}
 .winner{padding:22px;background:linear-gradient(180deg,#fff 0,#fff0f0 100%);margin-top:10px}.winner small{font-size:11px;font-weight:1000;color:var(--muted)} .winner h2{font-size:42px;line-height:1.05;margin:10px 0 8px} .winner p{margin:0;color:var(--red);font-weight:1000;letter-spacing:.08em}
 .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 #111;border-radius:20px;padding:14px;text-align:center}.stat strong{display:block;font-size:25px;font-weight:1000}.stat small{font-size:11px;color:var(--muted);font-weight:900}
 .center{text-align:center}
 @media (min-width:480px){ .frame{padding-left:22px;padding-right:22px} }
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="logo" onclick="goHome()"><div class="logo-badge"><span>🤪</span></div><div>GALA<em>PICK</em></div></div>
    <button id="help" class="headlink" onclick="showRules()">게임 방법 ↗</button>
  </header>
  <main id="main" class="main"></main>
</div>
<script>

a":"활동적인 곳","b":"조용히 대화할 곳"},{"id":"r10","category":"연애","question":"선물은 어떤 게 좋나?","a":"실용적인 선물","b":"감성적인 선물"},{"id":"r11","category":"연애","question":"연애에서 더 중요한 건?","a":"설렘과 텐션","b":"신뢰와 안정감"},{"id":"r12","category":"연애","question":"상대가 서운해하면 나는?","a":"바로 달래고 푼다","b":"왜 그런지부터 묻는다"},{"id":"r13","category":"연애","question":"이상형을 떠올릴 때 더 먼저 보는 건?","a":"외적인 분위기","b":"성격과 말투"},{"id":"r14","category":"연애","question":"연애 중 혼자만의 시간은?","a":"적당히 꼭 필요","b":"붙어 있어도 괜찮다"},{"id":"r15","category":"연애","question":"고백은 어떤 쪽이 더 좋나?","a":"직진형 고백","b":"분위기 타는 고백"},{"id":"s01","category":"친구","question":"친구랑 여행 가면 나는?","a":"계획 담당","b":"분위기 담당"},{"id":"s02","category":"친구","question":"친구가 고민 상담을 한다면?","a":"해결책부터 준다","b":"일단 공감부터 한다"},{"id":"s03","category":"친구","question":"약속에 늦은 친구를 보면?","a":"이해해 준다","b":"조금은 짜증 난다"},{"id":"s04","category":"친구","question":"친구 모임에서 나는?","a":"말 많이 하는 편","b":"듣다가 핵심만 말함"},{"id":"s05","category":"친구","question":"단톡방 스타일은?","a":"실시간 참여형","b":"몰아서 확인형"},{"id":"s06","category":"친구","question":"친구 생일선물은?","a":"필요한 실용템","b":"웃긴 이벤트형"},{"id":"s07","category":"친구","question":"보드게임할 때 나는?","a":"승부욕 활활","b":"재미면 됐지"},{"id":"s08","category":"친구","question":"친구와 다퉜을 때는?","a":"먼저 연락 가능","b":"상대가 정리될 때까지 기다림"},{"id":"s09","category":"친구","question":"친구 집에 놀러 가면?","a":"냉장고도 편하게 연다","b":"끝까지 눈치 본다"},{"id":"s10","category":"친구","question":"모임 메뉴 정할 때 나는?","a":"내 의견 확실히 말함","b":"다수 의견 따름"},{"id":"s11","category":"친구","question":"사진 찍을 때 나는?","a":"찍는 걸 좋아함","b":"찍히는 게 편함"},{"id":"s12","category":"친구","question":"친구가 갑자기 부르면?","a":"웬만하면 나간다","b":"계획 없으면 망설여진다"},{"id":"s13","category":"친구","question":"친구에게 빌린 돈은?","a":"바로 갚아야 마음 편함","b":"기억하고 있다가 한 번에"},{"id":"s14","category":"친구","question":"친구 관계에서 더 중요한 건?","a":"편안함","b":"의리"},{"id":"s15","category":"친구","question":"친구가 연애 상담을 하면?","a":"솔직하게 팩폭한다","b":"상처 안 주게 말한다"},{"id":"l01","category":"일상","question":"쉬는 날 더 끌리는 건?","a":"밖에서 돌아다니기","b":"집에서 푹 쉬기"},{"id":"l02","category":"일상","question":"일할 때 선호하는 환경은?","a":"적당한 소음이 있는 let state={screen:'home',names:['플레이어 1','플레이어 2'],category:'전체',rounds:5,deck:[],round:0,player:0,ballots:[],results:[],choice:null,pred:null};
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function headerLabel(){return ['handoff','vote','reveal','final'].includes(state.screen)?`ROUND ${Math.min(state.round+1,Math.max(state.deck.length,1))} / ${Math.max(state.deck.length,1)}`:(state.screen==='rules'?'닫기':'게임 방법 ↗')}
function setScreen(s){state.screen=s;render();window.scrollTo(0,0)}
function goHome(){state.screen='home';state.ballots=[];state.results=[];state.deck=[];render();window.scrollTo(0,0)}
function showRules(){setScreen(state.screen==='rules'?'home':'rules')}
function addName(){if(state.names.length<8){state.names.push('플레이어 '+(state.names.length+1));render()}}
function removeName(i){if(state.names.length>2){state.names.splice(i,1);render()}}
function editName(i,v){state.names[i]=v}
function chooseCategory(x){state.category=x;render()}
function chooseRound(x){state.rounds=x;render()}
function start(){let names=state.names.map(n=>n.trim());if(new Set(names.map(n=>n.toLowerCase())).size!==names.length||names.some(n=>!n||n.length>10)){alert('이름은 최대 10글자, 서로 다르게 입력해 주세요.');return}state.names=names;state.deck=QUESTIONS.filter(q=>state.category==='전체'||q.category===state.category).sort(()=>Math.random()-.5).slice(0,state.rounds);state.round=0;state.player=0;state.ballots=[];state.results=[];state.choice=null;state.pred=null;setScreen('handoff')}
function castVote(){if(!state.choice||!state.pred)return;state.ballots.push({choice:state.choice,pred:state.pred});state.choice=null;state.pred=null;if(state.ballots.length<state.names.length){state.player++;setScreen('handoff');return}let a=state.ballots.filter(x=>x.choice==='a').length,b=state.names.length-a,majority=a===b?'tie':a>b?'a':'b';let points=state.ballots.map(v=>majority==='tie'?5:(v.pred===majority?10:0)+(v.choice!==majority?5:0));state.results.push({a,b,majority,points,votes:[...state.ballots]});state.ballots=[];state.player=0;setScreen('reveal')}
function voteChoice(x){state.choice=x;render()}
function votePred(x){state.pred=x;render()}
function nextRound(){if(state.round+1>=state.deck.length){setScreen('final')}else{state.round++;state.player=0;setScreen('handoff')}}
function tally(){return state.names.map((name,i)=>({name,i,points:state.results.reduce((acc,r)=>acc+r.points[i],0)})).sort((a,b)=>b.points-a.points||a.i-b.i)}
async function share(){let lines=tally().map((p,i)=>`${i+1}위 ${p.name} · ${p.points}점`).join('\n');let message=`GALAPICK 🤪\n${state.names.length}명 · ${state.deck.length}라운드\n\n${lines}\n\nhttps://raw.githack.com/ksw11205-maker/portfolio/main/galapick/index.html`;if(navigator.share){try{await navigator.share({text:message})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(message);alert('결과와 링크가 복사됐어요.')}else alert(message)}

  const found=[]; for(const [re,token] of rules){ if(re.test(text)) found.push(token) } return found.length?found.slice(0,2):['generic']; }

  <text x="33" y="31" text-anchor="middle" font-size="13" font-weight="900">${side.toUpperCase()}</text>
</g></svg>`}
function shapePath(body){switch(body){case 'cone': return 'M80 18 C108 18 123 35 122 58 C121 79 104 90 92 98 L106 138 L54 138 L68 98 C54 88 38 77 38 58 C38 35 54 18 80 18 Z'; case 'cloud': return 'M45 104 C26 104 22 73 44 67 C41 44 66 34 84 44 C92 27 118 26 126 48 C144 49 149 72 136 84 C138 98 126 107 110 106 Z'; case 'bowl': return 'M34 84 Q80 126 126 84 L116 122 Q80 140 44 122 Z'; case 'bread': return 'M40 118 C26 104 25 75 45 62 C41 42 60 28 81 28 C101 28 120 42 116 62 C136 75 134 104 121 118 Z'; case 'drum': return 'M61 52 C84 34 110 42 119 64 C128 87 111 109 88 118 C65 126 44 116 36 94 C28 72 38 56 61 52 Z'; case 'egg': return 'M80 26 C110 26 124 57 124 90 C124 121 102 138 80 138 C58 138 36 121 36 90 C36 58 51 26 80 26 Z'; case 'cup': return 'M42 46 H104 V102 C104 124 88 138 73 138 C58 138 42 124 42 102 Z M104 58 C126 56 128 88 108 92'; case 'cake': return 'M43 68 H117 V118 H43 Z M37 68 C46 45 58 41 70 59 C79 40 93 44 101 58 C109 48 118 49 123 68 Z'; case 'fire': return 'M82 22 C92 46 115 51 115 79 C115 113 92 136 80 136 C58 136 41 114 41 86 C41 62 55 48 68 36 C71 48 76 57 84 63 C88 53 87 39 82 22 Z'; case 'box': return 'M48 48 H112 V126 H48 Z'; case 'snack': return 'M52 44 H108 L101 128 H59 Z'; case 'plate': return 'M80 30 C113 30 130 52 130 84 C130 116 109 136 80 136 C51 136 30 116 30 84 C30 52 47 30 80 30 Z'; case 'bag': return 'M47 52 H113 V126 H47 Z M59 52 C59 32 101 32 101 52'; case 'tv': return 'M34 42 H126 V116 H34 Z'; case 'robot': return 'M48 42 H112 V118 H48 Z M68 30 H92'; case 'house': return 'M40 74 L80 36 L120 74 V126 H40 Z'; case 'battery': return 'M42 50 H112 V116 H42 Z M112 68 H122 V98 H112'; case 'city': return 'M34 126 V72 H52 V126 M58 126 V56 H82 V126 M88 126 V80 H108 V126 M112 126 V66 H126 V126'; case 'phone': return 'M50 26 H110 C117 26 122 31 122 38 V122 C122 129 117 134 110 134 H50 C43 134 38 129 38 122 V38 C38 31 43 26 50 26 Z'; case 'calendar': return 'M40 42 H120 V126 H40 Z M40 58 H120'; case 'heart': return 'M80 131 C28 97 23 60 47 44 C62 34 76 44 80 54 C84 44 99 34 113 44 C137 60 132 97 80 131 Z'; case 'gift': return 'M42 58 H118 V126 H42 Z M80 58 V126 M42 82 H118 M62 58 C53 52 53 38 66 38 C78 38 80 52 80 58 M98 58 C107 52 107 38 94 38 C82 38 80 52 80 58'; case 'storm': return 'M45 102 C26 102 23 72 48 67 C48 50 62 39 77 39 C90 39 99 45 104 55 C123 53 137 67 134 86 C132 99 123 104 109 104 L94 132'; case 'bus': return 'M40 54 H120 V106 H40 Z M55 114 A10 10 0 1 0 55 134 A10 10 0 1 0 55 114 M105 114 A10 10 0 1 0 105 134 A10 10 0 1 0 105 114'; case 'bubble': return 'M32 46 H128 V110 H78 L56 128 V110 H32 Z'; case 'clock': return 'M80 30 A50 50 0 1 0 80 130 A50 50 0 1 0 80 30 Z'; case 'dice': return 'M44 44 H116 V116 H44 Z'; case 'camera': return 'M36 62 H124 V118 H36 Z M54 52 H78'; case 'wallet': return 'M40 54 H124 V118 H40 Z M93 78 H124'; case 'strong': return 'M44 56 C52 40 66 34 82 38 C97 43 107 52 116 64 L106 126 H54 Z'; default: return 'M80 28 C107 18 128 34 130 57 C142 66 141 89 124 100 C123 124 103 136 81 135 C60 145 33 133 31 106 C14 94 15 67 31 56 C31 37 52 23 80 28 Z';}}
function faceBits(body,mouth){const m = mouth==='smile'?'M62 96 Q80 108 98 96':'M62 100 Q80 88 98 100'; return `<circle cx="64" cy="76" r="5" fill="#111"/><circle cx="96" cy="76" r="5" fill="#111"/><path d="${m}" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>`}
function questionArt(q){const tokensA=artTokens(q.question+' '+q.a), tokensB=artTokens(q.question+' '+q.b); return `<div class="panel artbox"><div class="burst">${labelBurst(q)}</div><div class="doodle"><div class="char"><div class="svgwrap">${doodleSVG(tokensA[0],'a',q.a)}</div><label>${esc(q.a)}</label></div><div class="mid-vs">VS</div><div class="char"><div class="svgwrap">${doodleSVG(tokensB[0],'b',q.b)}</div><label>${esc(q.b)}</label></div></div></div>`}
function render(){let s=state.screen,q=state.deck[state.round],r=state.results[state.results.length-1]; $('help').textContent=headerLabel(); let h='';
 if(s==='home') h=`<section><div class="kicker"><span class="kdot"></span> CHAOS PARTY GAME</div><h1 class="hero-title">같은 편인 줄<br>알았지<b>?</b></h1><p class="sub">질문마다 병맛 그림이 튀어나오는,<br>말도 안 되게 웃긴 밸런스 게임.</p><div class="hero-grid"><div class="panel monster-card"><div class="sticker s1">NO LOGIN</div><div class="sticker s2">2~8명</div><div class="vs-stage"><div class="monster"><div class="blob a">🍕</div><label>내 취향은 A</label></div><div class="vs-chip">VS</div><div class="monster"><div class="blob b">🛌</div><label>너 취향은 B?</label></div></div></div></div><div class="feature-row">${tag('질문 60개')}${tag('비밀 투표')}${tag('점수 경쟁')}${tag('병맛 그림')}</div>${btn('새 게임 시작하기',"setScreen('setup')")}${btn('게임 방법 보기',"setScreen('rules')",'secondary')}<p class="small-note">친구들끼리 돌려가며 하면 더 웃김. 결과 공유도 가능!</p></section>`;
 if(s==='rules') h=`<div class="kicker"><span class="kdot"></span> HOW TO PLAY</div><h1 class="title">룰은 간단.<br><b>눈치</b>는 안 간단.</h1><p class="desc">휴대폰 한 대로 돌아가며 몰래 선택하고, 다른 사람들이 뭘 고를지 예측하면 끝!</p><div class="panel setup-card">${[['1','인원과 주제 선택','2명부터 8명까지. 음식·연애·친구·일상 중 원하는 주제를 고른다.'],['2','차례대로 비밀 투표','A/B 중 하나를 선택하고, 다수가 어디에 몰릴지 예측한다.'],['3','라운드 결과 공개','예측 성공 +10점, 소수 선택 보너스 +5점, 동률이면 모두 +5점.'],['4','최종 순위 발표','친구들끼리 누가 제일 눈치가 빠른지 확인한다.']].map(x=>`<div class="rule"><div class="rule-badge">${x[0]}</div><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div>${btn('플레이 시작하기',"setScreen('setup')")}`;
 if(s==='setup') h=`<div class="kicker"><span class="kdot"></span> SETUP</div><h1 class="title">누가 들어오나?<br>누가 이기나?</h1><p class="desc">플레이어 이름, 주제, 라운드 수를 정하고 바로 시작하자.</p><div class="setup-card"><div class="section">PLAYERS <span style="color:var(--muted)">${state.names.length} / 8</span></div>${state.names.map((n,i)=>`<div class="name-row"><span>${String(i+1).padStart(2,'0')}</span><input maxlength="10" value="${esc(n)}" onchange="editName(${i},this.value)" oninput="editName(${i},this.value)" aria-label="${i+1}번째 이름">${state.names.length>2?`<button class="iconbtn" onclick="removeName(${i})">✖️</button>`:''}</div>`).join('')}${state.names.length<8?'<button class="dash-btn" onclick="addName()">＋ 한 명 더 부르기</button>':''}</div><div class="setup-card"><div class="section">TOPIC</div><div class="categories">${CATS.map(([n,d,g])=>`<button class="cat ${state.category===n?'active':''}" onclick="chooseCategory('${n}')"><span class="glyph">${g}</span><strong>${n}</strong><small>${d}</small></button>`).join('')}</div></div><div class="setup-card"><div class="section">ROUNDS</div><div class="rounds">${[5,10,15].map(n=>`<button class="round-btn ${n===state.rounds?'active':''}" onclick="chooseRound(${n})"><strong>${n}</strong><small>라운드</small></button>`).join('')}</div></div>${btn('이 멤버로 시작하기','start()')}<p class="small-note">서버 저장 없음 · 기기 안에서만 진행 · 가볍게 웃고 끝내기 좋음</p>`;
 if(s==='handoff') h=`<div class="kicker"><span class="kdot"></span> SECRET TURN ${state.player+1}/${state.names.length}</div><h1 class="title">핸드폰 넘겨!</h1><div class="panel handoff-card"><div class="handoff-badge">🙈</div><div style="font-size:13px;font-weight:900;color:var(--muted)">다음 플레이어 차례</div><div class="turn-name">${esc(state.names[state.player])}</div><p class="desc center">앞 사람의 선택은 잊어버리고,<br>네 취향만 믿고 고르면 된다.</p><div class="dots">${state.names.map((_,i)=>`<i class="${i<=state.player?'fill':''}"></i>`).join('')}</div></div>${btn('내 차례 시작하기',"setScreen('vote')")}`;
 if(s==='vote') h=`<div class="kicker"><span class="kdot"></span> ${esc(state.names[state.player])}의 차례</div><h1 class="question">${esc(q.question)}</h1><div class="tags">${tag(q.category)}${tag('병맛 그림 ON')}</div>${questionArt(q)}<div class="vlabel">STEP 1 · 나는 뭘 고를까?</div>${['a','b'].map(x=>`<button class="choice ${state.choice===x?'active':''}" onclick="voteChoice('${x}')"><span class="badge">${x.toUpperCase()}</span><strong>${esc(q[x])}</strong><small>${state.choice===x?'😎':'👀'}</small></button>`).join('')}<div class="vlabel">STEP 2 · 다수는 어디에 몰릴까?</div><div class="predictions">${['a','b'].map(x=>`<button class="prediction ${state.pred===x?'active':''}" onclick="votePred('${x}')"><strong>${x.toUpperCase()}가 다수</strong><span>${x==='a'?esc(q.a):esc(q.b)}</span></button>`).join('')}</div>${btn(state.player===state.names.length-1?'결과 까보기':'선택 확정하고 넘기기','castVote()','',!state.choice||!state.pred)}<p class="small-note">확정하면 되돌릴 수 없음. 고민은 길수록 더 웃김.</p>`;
 if(s==='reveal') h=`<div class="kicker"><span class="kdot"></span> ROUND ${state.round+1} RESULT</div><h1 class="result-title">결과 공개<em>!</em></h1><p class="desc">${esc(q.question)}</p>${questionArt(q)}<div class="resultbox">${['a','b'].map(x=>`<div class="barhead"><div><small>${x.toUpperCase()}</small><strong>${esc(q[x])}</strong></div><div class="pct">${Math.round(r[x]/state.names.length*100)}%</div></div><div class="bar"><div class="fill ${x}" style="width:${(r[x]/state.names.length*100).toFixed(1)}%"></div></div>`).join('')}<div class="small-note" style="text-align:left;margin-top:4px">${r.majority==='tie'?'⚖️ 완벽한 동률! 모두 점수 획득':`🔥 ${r.majority.toUpperCase()} 쪽으로 몰렸다!`}</div></div><div class="section" style="margin-top:18px">THIS ROUND SCORE</div>${state.names.map((n,i)=>`<div class="score"><div class="avatar">${esc(n[0])}</div><div class="meta"><strong>${esc(n)}</strong><small>선택 ${r.votes[i].choice.toUpperCase()} · 예측 ${r.votes[i].pred.toUpperCase()}</small></div><div class="points">+${r.points[i]}</div></div>`).join('')}${btn(state.round+1>=state.deck.length?'최종 순위 보기':'다음 라운드 가기','nextRound()')}`;
 if(s==='final'){const board=tally(); h=`<div class="kicker"><span class="kdot"></span> FINAL RANKING</div><h1 class="title">오늘의 <b>눈치왕</b><br>발표 시간.</h1><div class="winner"><small>🥇 WINNER</small><h2>${esc(board[0].name)}</h2><p>${board[0].points} POINTS</p>${board[1]&&board[1].points===board[0].points?'<div class="small-note" style="text-align:left">공동 1위 발생! 둘 다 눈치가 너무 빠름.</div>':''}</div><div class="section" style="margin-top:18px">RANKING BOARD</div>${board.map((p,i)=>`<div class="score"><div class="avatar">${i+1}</div><div class="meta"><strong>${esc(p.name)}</strong><small>${i===0?'오늘의 레전드':'다음엔 역전 가능'}</small></div><div class="points">${p.points}점</div></div>`).join('')}<div class="stats"><div class="stat"><strong>${state.deck.length}</strong><small>총 라운드</small></div><div class="stat"><strong>${state.results.filter(x=>x.a===0||x.b===0).length}</strong><small>만장일치</small></div><div class="stat"><strong>${state.results.filter(x=>x.majority==='tie').length}</strong><small>동률</small></div></div>${btn('결과 + 링크 공유하기','share()')}${btn('같은 멤버로 다시하기','start()','secondary')}${btn('홈으로 돌아가기','goHome()','ghost')}` }
 $('main').innerHTML=h; }
render();
</script>
</body>
</html>
